[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-design-editor"
version = "0.1.0"
description = "Local, mask-constrained design editing with exact protected-pixel verification"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0", "numpy==2.2.6", "opencv-python-headless==4.12.0.88", "requests==2.32.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
design-edit = "design_editor.cli:main"

[tool.setuptools.packages.find]
include = ["design_editor*"]
